[graph]
# Only the two release targets. A dependency that resolves on neither is not this
# project's problem, and checking targets nobody ships produces noise.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
# `IJG` is not OSI-approved, so it stays out of the allow-list above and is granted per
# crate instead: an exception names the crate it applies to, an allow-list entry would
# silently cover every future IJG dependency.
exceptions = [
    # The mozjpeg binding. `IJG` permits use, modification, and redistribution of source
    # and binaries provided the origin is not misrepresented; it is the licence libjpeg
    # has carried since 1991 and is standard for JPEG tooling.
    { name = "mozjpeg", allow = ["IJG"] },
    # Builds mozjpeg from vendored C. Its expression is `IJG AND Zlib AND BSD-3-Clause`;
    # only the `IJG` term needs granting, the other two are already allowed above.
    { name = "mozjpeg-sys", allow = ["IJG"] },
    # No entry for the rar dependency, and the absence is the finding rather than an
    # oversight. `unrar-ng` and `unrar-ng-sys` both declare `MIT OR Apache-2.0`, so this
    # check passes them — while the tree they build is RARLAB's UnRAR under a non-OSI
    # licence at `vendor/unrar/license.txt`. cargo-deny reads licence files only at a
    # crate's root and only when the name begins with `LICENSE` or `COPYING`, and it does
    # not recurse, so it never sees that file and the sys crate ships no root licence at
    # all. Granting an exception here would be worse than useless: it would imply the
    # check had found something. `NOTICE.md` carries the obligation instead, and a test
    # asserts it survives.
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# A Git dependency is a temporary measure, so it must name a revision rather than a
# branch that can move underneath a previously green build.
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The `mozjpeg` fork carrying `Compress::set_dct_method` and the warning accessors.
# Deleted together with `[patch.crates-io]` in `Cargo.toml` when both
# https://github.com/ImageOptim/mozjpeg-rust/pull/54 and
# https://github.com/ImageOptim/mozjpeg-rust/pull/55 land in a release.
#
# The `unrar-ng` fork, carrying one commit: a `DataSink` seam that lets a read be aborted
# part-way, which `src/source/rar.rs` needs to bound an entry as `src/source/zip.rs` does.
# Deleted together with its `[patch.crates-io]` entry when that change stops being needed.
# Rationale, drift, and the upstream decision are in `Cargo.toml`.
allow-git = [
    "https://github.com/pashifika/mozjpeg-rust.git",
    "https://github.com/pashifika/unrar.rs.git",
]
unused-allowed-source = "allow"
