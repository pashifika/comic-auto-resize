[package]
name = "comic-auto-resize"
version = "2.0.0-dev"
edition = "2024"
# The crate's own floor, separate from the channel pinned in `rust-toolchain.toml`.
# Edition 2024 and clap 4.6 both require 1.85; nothing here needs more yet. Later
# changes raise it when a dependency actually demands it, not pre-emptively.
rust-version = "1.85"
description = "Auto-resize the pages of a comic archive and repack them as zip"
license = "Apache-2.0"
repository = "https://github.com/pashifika/comic-auto-resize"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
# `forbid` rather than `deny`: FFI belongs to dependencies, so there is no module here
# that could ever justify lifting it.
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
